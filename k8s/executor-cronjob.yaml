apiVersion: batch/v1
kind: CronJob
metadata:
  name: executor
  namespace: swing-trader
spec:
  # MUST run while the US options market is open — Alpaca rejects options orders
  # outside regular hours with a 422. 15:00 UTC is inside the session year-round:
  # 11:00 EDT in summer (open 13:30-20:00 UTC), 10:00 EST in winter (14:30-21:00 UTC).
  # Running this after the close is what silently killed execution 2026-08-31.
  schedule: "0 15 * * 1-5"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0  # no retries — must not double-place orders
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: executor
              image: ghcr.io/sletikkesoren/weekly-swing-trader:latest
              imagePullPolicy: Always
              command: ["/bin/sh", "-c"]
              args:
                - |
                  python -m executor.main
                  EXIT=$?
                  if [ $EXIT -ne 0 ]; then
                    curl -s -X POST "$DISCORD_WEBHOOK_URL" \
                      -H 'Content-Type: application/json' \
                      -d '{"content": "❌ **executor** CronJob failed — check k8s logs"}'
                    exit $EXIT
                  fi
              env:
                - name: INPUT_DIR
                  value: "/data/gate"
                - name: OUTPUT_DIR
                  value: "/data/executor"
                - name: ALPACA_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: alpaca-credentials
                      key: api_key
                - name: ALPACA_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: alpaca-credentials
                      key: secret_key
                - name: ALPACA_BASE_URL
                  value: "https://paper-api.alpaca.markets"
                - name: ORDER_TYPE
                  value: "limit"
                - name: LIMIT_PRICE_BUFFER
                  value: "1.05"
                - name: DRY_RUN
                  value: "false"
                # Refuse to submit while the market is closed rather than
                # collecting 422s from Alpaca.
                - name: REQUIRE_MARKET_OPEN
                  value: "true"
                # approved.json lives on the shared PVC; anything older than this
                # means the gate did not run today and must not be executed.
                - name: MAX_APPROVAL_AGE_HOURS
                  value: "6"
                # No quote -> skip the trade. A market order on an option with an
                # unknown spread can fill anywhere.
                - name: ALLOW_MARKET_FALLBACK
                  value: "false"
                - name: ALPACA_OPTIONS_FEED
                  value: "indicative"
                - name: DISCORD_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: gate-secrets
                      key: approval_webhook_url
                - name: AUDIT_S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: audit-secrets
                      key: s3_endpoint
                - name: AUDIT_S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: audit-secrets
                      key: s3_bucket
                - name: AUDIT_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: audit-secrets
                      key: s3_access_key
                - name: AUDIT_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: audit-secrets
                      key: s3_secret_key
              volumeMounts:
                - name: pipeline-data
                  mountPath: /data
          volumes:
            - name: pipeline-data
              persistentVolumeClaim:
                claimName: pipeline-data-pvc
# Reuses the alpaca-credentials secret created by the fetcher:
# kubectl create secret generic alpaca-credentials \
#   --from-literal=api_key=<KEY> \
#   --from-literal=secret_key=<SECRET> \
#   -n swing-trader
