apiVersion: batch/v1
kind: CronJob
metadata:
  name: executor
  namespace: swing-trader
spec:
  # 90 min after fetcher — 22:30 UTC = 00:30 CEST (summer) / 23:30 CET (winter).
  schedule: "30 22 * * 1-5"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0  # no retries — must not double-place orders
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: executor
              image: ghcr.io/sletikkesoren/weekly-swing-trader:latest
              imagePullPolicy: Always
              command: ["/bin/sh", "-c"]
              args:
                - |
                  python -m executor.main
                  EXIT=$?
                  if [ $EXIT -ne 0 ]; then
                    curl -s -X POST "$DISCORD_WEBHOOK_URL" \
                      -H 'Content-Type: application/json' \
                      -d '{"content": "❌ **executor** CronJob failed — check k8s logs"}'
                    exit $EXIT
                  fi
              env:
                - name: INPUT_DIR
                  value: "/data/gate"
                - name: OUTPUT_DIR
                  value: "/data/executor"
                - name: ALPACA_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: alpaca-credentials
                      key: api_key
                - name: ALPACA_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: alpaca-credentials
                      key: secret_key
                - name: ALPACA_BASE_URL
                  value: "https://paper-api.alpaca.markets"
                - name: ORDER_TYPE
                  value: "limit"
                - name: LIMIT_PRICE_BUFFER
                  value: "1.05"
                - name: DRY_RUN
                  value: "false"
                - name: DISCORD_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: gate-secrets
                      key: approval_webhook_url
                - name: AUDIT_S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: audit-secrets
                      key: s3_endpoint
                - name: AUDIT_S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: audit-secrets
                      key: s3_bucket
                - name: AUDIT_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: audit-secrets
                      key: s3_access_key
                - name: AUDIT_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: audit-secrets
                      key: s3_secret_key
              volumeMounts:
                - name: pipeline-data
                  mountPath: /data
          volumes:
            - name: pipeline-data
              persistentVolumeClaim:
                claimName: pipeline-data-pvc
# Reuses the alpaca-credentials secret created by the fetcher:
# kubectl create secret generic alpaca-credentials \
#   --from-literal=api_key=<KEY> \
#   --from-literal=secret_key=<SECRET> \
#   -n swing-trader
