apiVersion: batch/v1
kind: CronJob
metadata:
  name: executor
  namespace: swing-trader
spec:
  # 15 minutes after gate (22:15 UTC Mon–Fri)
  schedule: "15 22 * * 1-5"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0  # no retries — must not double-place orders
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: executor
              image: ghcr.io/SletIkkeSoren/weekly-swing-trader:latest
              command: ["python", "-m", "executor.main"]
              env:
                - name: INPUT_DIR
                  value: "/data/gate"
                - name: OUTPUT_DIR
                  value: "/data/executor"
                - name: ALPACA_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: alpaca-credentials
                      key: api_key
                - name: ALPACA_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: alpaca-credentials
                      key: secret_key
                - name: ALPACA_BASE_URL
                  value: "https://paper-api.alpaca.markets"
                - name: ORDER_TYPE
                  value: "limit"
                - name: LIMIT_PRICE_BUFFER
                  value: "1.05"
                - name: DRY_RUN
                  value: "false"
              volumeMounts:
                - name: pipeline-data
                  mountPath: /data
          volumes:
            - name: pipeline-data
              persistentVolumeClaim:
                claimName: pipeline-data-pvc
# Reuses the alpaca-credentials secret created by the fetcher:
# kubectl create secret generic alpaca-credentials \
#   --from-literal=api_key=<KEY> \
#   --from-literal=secret_key=<SECRET> \
#   -n swing-trader
