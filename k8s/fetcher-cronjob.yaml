apiVersion: batch/v1
kind: CronJob
metadata:
  name: fetcher
  namespace: swing-trader
spec:
  # Hourly during market hours — 13:30–19:30 UTC = 15:30–21:30 CEST (summer).
  # NOTE: Update hour range to 14-20 in late October (CET/EST winter shift).
  schedule: "30 13-19 * * 1-5"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: fetcher
              image: ghcr.io/sletikkesoren/weekly-swing-trader:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  python -m fetcher.main
                  EXIT=$?
                  if [ $EXIT -ne 0 ]; then
                    curl -s -X POST "$DISCORD_WEBHOOK_URL" \
                      -H 'Content-Type: application/json' \
                      -d '{"content": "❌ **fetcher** CronJob failed — check k8s logs"}'
                    exit $EXIT
                  fi
              env:
                - name: ALPACA_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: alpaca-credentials
                      key: api_key
                - name: ALPACA_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: alpaca-credentials
                      key: secret_key
                - name: ALPACA_BASE_URL
                  value: "https://paper-api.alpaca.markets"
                - name: TICKERS
                  valueFrom:
                    configMapKeyRef:
                      name: fetcher-config
                      key: tickers
                - name: LOOKBACK_DAYS
                  value: "252"
                - name: OUTPUT_DIR
                  value: "/data/fetcher"
                - name: DISCORD_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: gate-secrets
                      key: approval_webhook_url
                - name: AUDIT_S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: audit-secrets
                      key: s3_endpoint
                - name: AUDIT_S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: audit-secrets
                      key: s3_bucket
                - name: AUDIT_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: audit-secrets
                      key: s3_access_key
                - name: AUDIT_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: audit-secrets
                      key: s3_secret_key
              volumeMounts:
                - name: pipeline-data
                  mountPath: /data
          volumes:
            - name: pipeline-data
              persistentVolumeClaim:
                claimName: pipeline-data-pvc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fetcher-config
  namespace: swing-trader
data:
  tickers: "SPY,QQQ,AAPL,MSFT,NVDA,TSLA,AMZN,META,GOOGL"
