apiVersion: batch/v1
kind: CronJob
metadata:
  name: report
  namespace: swing-trader
spec:
  # After the close — 21:30 UTC = 17:30 EDT (summer) / 16:30 EST (winter),
  # i.e. 23:30 CEST / 22:30 CET.
  schedule: "30 21 * * 1-5"
  # Retired 2026-09-26: the LLM options pipeline had no edge in backtests (see
  # backtest/). Replaced by k8s/zerodte-cronjob.yaml. Remove this line to revive.
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1  # read-only + a Discord post — safe to retry once, unlike gate/executor
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: report
              image: ghcr.io/sletikkesoren/weekly-swing-trader:latest
              imagePullPolicy: Always
              command: ["python", "-m", "report.main"]
              env:
                - name: MIN_CONFIDENCE
                  value: "0.65"
                - name: DISCORD_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: gate-secrets
                      key: approval_webhook_url
                - name: AUDIT_S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: audit-secrets
                      key: s3_endpoint
                - name: AUDIT_S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: audit-secrets
                      key: s3_bucket
                - name: AUDIT_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: audit-secrets
                      key: s3_access_key
                - name: AUDIT_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: audit-secrets
                      key: s3_secret_key
