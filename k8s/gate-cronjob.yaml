apiVersion: batch/v1
kind: CronJob
metadata:
  name: gate
  namespace: swing-trader
spec:
  # 60 min after fetcher — 22:00 UTC = 00:00 CEST (summer) / 23:00 CET (winter).
  schedule: "0 22 * * 1-5"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0  # no retries — approval webhooks must not fire twice
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: gate
              image: ghcr.io/sletikkesoren/weekly-swing-trader:latest
              imagePullPolicy: Always
              command: ["/bin/sh", "-c"]
              args:
                - |
                  python -m gate.main
                  EXIT=$?
                  if [ $EXIT -ne 0 ]; then
                    curl -s -X POST "$APPROVAL_WEBHOOK_URL" \
                      -H 'Content-Type: application/json' \
                      -d '{"content": "❌ **gate** CronJob failed — check k8s logs"}'
                    exit $EXIT
                  fi
              env:
                - name: INPUT_DIR
                  value: "/data/consensus"
                - name: OUTPUT_DIR
                  value: "/data/gate"
                - name: ACCOUNT_SIZE
                  valueFrom:
                    configMapKeyRef:
                      name: gate-config
                      key: account_size
                - name: MIN_CONFIDENCE
                  value: "0.65"
                - name: MIN_AGREEMENT
                  value: "2"
                - name: MAX_OPEN_TRADES
                  value: "3"
                - name: RISK_PCT
                  value: "0.01"
                - name: MAX_CONTRACTS
                  value: "5"
                - name: MIN_HOLD_CONFIDENCE
                  value: "0.45"
                - name: APPROVAL_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: gate-secrets
                      key: approval_webhook_url
                - name: WEBHOOK_TIMEOUT_SECS
                  value: "300"
                - name: AUDIT_S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: audit-secrets
                      key: s3_endpoint
                - name: AUDIT_S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: audit-secrets
                      key: s3_bucket
                - name: AUDIT_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: audit-secrets
                      key: s3_access_key
                - name: AUDIT_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: audit-secrets
                      key: s3_secret_key
              volumeMounts:
                - name: pipeline-data
                  mountPath: /data
          volumes:
            - name: pipeline-data
              persistentVolumeClaim:
                claimName: pipeline-data-pvc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gate-config
  namespace: swing-trader
data:
  account_size: "10000"
---
