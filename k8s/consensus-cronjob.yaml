apiVersion: batch/v1
kind: CronJob
metadata:
  name: consensus
  namespace: swing-trader
spec:
  # 15 minutes after fetcher each hour (15:15–20:15 UTC Mon–Fri)
  schedule: "15 15-22 * * 1-5"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: consensus
              image: ghcr.io/sletikkesoren/weekly-swing-trader:latest
              command: ["python", "-m", "consensus.main"]
              env:
                - name: ANTHROPIC_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: llm-credentials
                      key: anthropic_api_key
                - name: GOOGLE_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: llm-credentials
                      key: google_api_key
                - name: INPUT_DIR
                  value: "/data/fetcher"
                - name: OUTPUT_DIR
                  value: "/data/consensus"
              volumeMounts:
                - name: pipeline-data
                  mountPath: /data
          volumes:
            - name: pipeline-data
              persistentVolumeClaim:
                claimName: pipeline-data-pvc
---
