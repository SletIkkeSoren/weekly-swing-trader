apiVersion: batch/v1
kind: CronJob
metadata:
  name: consensus
  namespace: swing-trader
spec:
  # 30 min after fetcher — 21:30 UTC = 23:30 CEST (summer) / 22:30 CET (winter).
  # 30 min after fetcher, still pre-open — 12:30 UTC.
  schedule: "30 12 * * 1-5"
  # Retired 2026-09-26: the LLM options pipeline had no edge in backtests (see
  # backtest/). Replaced by k8s/zerodte-cronjob.yaml. Remove this line to revive.
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 480  # kill job after 8 min — 9 tickers × ~60s timeout + buffer
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: consensus
              image: ghcr.io/sletikkesoren/weekly-swing-trader:latest
              imagePullPolicy: Always
              command: ["/bin/sh", "-c"]
              args:
                - |
                  python -m consensus.main
                  EXIT=$?
                  if [ $EXIT -ne 0 ]; then
                    curl -s -X POST "$DISCORD_WEBHOOK_URL" \
                      -H 'Content-Type: application/json' \
                      -d '{"content": "❌ **consensus** CronJob failed — check k8s logs"}'
                    exit $EXIT
                  fi
              env:
                - name: MISTRAL_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: llm-credentials
                      key: mistral_api_key
                - name: GOOGLE_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: llm-credentials
                      key: google_api_key
                - name: OPENAI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: llm-credentials
                      key: openai_api_key
                - name: DISCORD_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: gate-secrets
                      key: approval_webhook_url
                - name: INPUT_DIR
                  value: "/data/fetcher"
                - name: OUTPUT_DIR
                  value: "/data/consensus"
                - name: AUDIT_S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: audit-secrets
                      key: s3_endpoint
                - name: AUDIT_S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: audit-secrets
                      key: s3_bucket
                - name: AUDIT_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: audit-secrets
                      key: s3_access_key
                - name: AUDIT_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: audit-secrets
                      key: s3_secret_key
              volumeMounts:
                - name: pipeline-data
                  mountPath: /data
          volumes:
            - name: pipeline-data
              persistentVolumeClaim:
                claimName: pipeline-data-pvc
---
